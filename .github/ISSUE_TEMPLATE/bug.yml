name: Bug report
description: Report a reproducible engineering defect
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, account data, licensed datasets, or security vulnerabilities.
  - type: textarea
    id: summary
    attributes:
      label: Defect
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands, inputs, and the smallest safe example that reproduces the defect.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA or release identifier.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or evidence
      description: Redact secrets and proprietary data.
