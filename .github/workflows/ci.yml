name: ci

# The enforced clean-checkout quality gate: governed Ruff scope, mypy --strict,
# and the portable offline test suite. Workstation evidence checks are reported
# separately because their ignored corpus and sibling repositories are absent
# from a GitHub checkout. The historical-script Ruff debt exporter is executed
# here to prove it remains buildable, but its local contract is not falsely
# presented as a tracked freshness comparison.
#
# Reproducibility: the environment is built from the committed uv.lock with
# "uv sync --frozen" so CI resolves the EXACT pinned dependency set (it never
# rewrites pyproject.toml or the lock). PYTHONHASHSEED is pinned for determinism
# (belt-and-suspenders; the suite has no known hash-ordering dependency today).
#
# Offline by decree: no job reaches a live exchange API. The clean-checkout job
# also deselects explicitly marked workspace-evidence integration checks, whose
# inputs are intentionally git-ignored or live in sibling site workspaces. The
# complete offline suite remains a separate local verification claim.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  # Keep uv's resolution and cache deterministic across runners.
  UV_FROZEN: "1"

jobs:
  lint:
    name: ruff (governed scope + debt ledger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Pin Python from .python-version
        run: uv python install
      - name: Sync the frozen environment
        run: uv sync --frozen --dev
      - name: ruff check
        run: uv run ruff check src/alphaforge tests
      - name: Build the disclosed historical-script debt contract
        run: |
          uv run python scripts/export_lint_debt_contract.py
          test -s artifacts/engineering/lint_debt_contract.json

  typecheck:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Pin Python from .python-version
        run: uv python install
      - name: Sync the frozen environment
        run: uv sync --frozen --dev
      # strict + the package layout are configured in pyproject.toml [tool.mypy];
      # this invocation adds nothing, so it cannot drift from the local run.
      - name: mypy
        run: uv run mypy

  test:
    name: pytest (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Pin Python from .python-version
        run: uv python install
      - name: Sync the frozen environment
        run: uv sync --frozen --dev
      # Network tests and workspace-evidence integration tests are excluded from
      # this portable clean-checkout gate. The latter cannot run without the
      # deliberately unversioned evidence corpus and sibling website workspaces;
      # each such test is explicitly marked instead of failing accidentally.
      # Branch coverage of the alphaforge package is collected by pyproject
      # (--cov=alphaforge --cov-branch) on every run; -p no:randomly is not used
      # because nothing here is order-dependent. We emit an XML report and a
      # terminal summary as build artifacts. No --cov-fail-under is enforced yet
      # (see pyproject): a floor is pinned once a true baseline is observed,
      # rather than redding CI aspirationally.
      - name: pytest (portable offline suite with branch coverage)
        run: >-
          uv run pytest -m 'not network and not workspace_evidence'
          --cov-report=xml --cov-report=term
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
