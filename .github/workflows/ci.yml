name: ci

# The enforced clean-checkout quality gate: governed Ruff scope, mypy --strict,
# and the portable offline test suite. Workstation evidence checks are reported
# separately because their ignored corpus and sibling repositories are absent
# from a GitHub checkout. The historical-script Ruff debt exporter is executed
# here to prove it remains buildable, but its local contract is not falsely
# presented as a tracked freshness comparison.
#
# Reproducibility: the environment is built from the committed uv.lock with
# "uv sync --frozen" so CI resolves the EXACT pinned dependency set (it never
# rewrites pyproject.toml or the lock). PYTHONHASHSEED is pinned for determinism
# (belt-and-suspenders; the suite has no known hash-ordering dependency today).
#
# Offline by decree: no job reaches a live exchange API. The clean-checkout job
# also deselects explicitly marked workspace-evidence integration checks, whose
# inputs are intentionally git-ignored or live in sibling site workspaces. The
# complete offline suite remains a separate local verification claim.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  # Keep uv's resolution and cache deterministic across runners.
  UV_FROZEN: "1"

jobs:
  publication-integrity:
    name: publication integrity (clean checkout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify all tracked scholarly preparation bundles
        run: >-
          python scripts/verify_publication_clean_checkout.py
          --receipt publication-clean-checkout-integrity.json
      - name: Upload the commit-bound verification receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-clean-checkout-integrity
          path: publication-clean-checkout-integrity.json
          if-no-files-found: error

  lint:
    name: ruff (governed scope + debt ledger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Pin Python from .python-version
        run: uv python install
      - name: Sync the frozen environment
        run: uv sync --frozen --dev
      - name: ruff check
        run: uv run ruff check src/alphaforge tests
      - name: Build the disclosed historical-script debt contract
        run: |
          uv run python scripts/export_lint_debt_contract.py
          test -s artifacts/engineering/lint_debt_contract.json

  typecheck:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Pin Python from .python-version
        run: uv python install
      - name: Sync the frozen environment
        run: uv sync --frozen --dev
      # strict + the package layout are configured in pyproject.toml [tool.mypy];
      # this invocation adds nothing, so it cannot drift from the local run.
      - name: mypy
        run: uv run mypy

  test:
    name: pytest (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Pin Python from .python-version
        run: uv python install
      - name: Sync the frozen environment
        run: uv sync --frozen --dev
      # Network, workspace-evidence and wall-clock performance tests are excluded
      # from this parallel correctness lane. Workspace evidence cannot run without
      # the deliberately unversioned corpus and sibling website workspaces; the
      # exact module inventory is versioned in
      # config/clean_checkout_workspace_evidence_policy.json. Slow
      # performance guards run serially in the next mandatory step: measuring an
      # 8-second wall budget while 17 sibling workers contend for the host measures
      # pytest scheduling rather than engine performance.
      # Branch coverage of the alphaforge package is collected by pyproject
      # (--cov=alphaforge --cov-branch) on every run; -p no:randomly is not used
      # because nothing here is order-dependent. We emit an XML report and a
      # terminal summary as build artifacts. No --cov-fail-under is enforced yet
      # (see pyproject): a floor is pinned once a true baseline is observed,
      # rather than redding CI aspirationally.
      - name: pytest (portable offline suite with branch coverage)
        env:
          ALPHAC_TEST_CONTEXT: clean-checkout-portable
        run: >-
          uv run pytest -m 'not network and not workspace_evidence and not slow'
          --cov-report=xml --cov-report=term
      - name: pytest (serial performance guards)
        env:
          ALPHAC_TEST_CONTEXT: clean-checkout-portable
        run: >-
          uv run pytest -n0 --no-cov
          -m 'slow and not network and not workspace_evidence'
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  browser-interface:
    name: browser interface (synthetic clean-checkout fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Pin Python from .python-version
        run: uv python install
      - name: Sync the frozen environment
        run: uv sync --frozen --dev
      - name: Install the ephemeral Chromium QA runtime
        run: uv run --with playwright playwright install --with-deps chromium
      - name: Build and exercise the synthetic blind-review interface fixture
        shell: bash
        run: |
          fixture_dir=/tmp/alphac-active-ownership-browser-fixture
          uv run python tests/browser/build_active_ownership_browser_fixture.py --out "$fixture_dir"
          uv run python -m http.server 8765 --bind 127.0.0.1 --directory "$fixture_dir" \
            >/tmp/alphac-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/review.html >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:8765/review.html >/dev/null
          uv run --with playwright python \
            tests/browser/test_active_ownership_review_workspace.py \
            --packet-dir "$fixture_dir" \
            --url http://127.0.0.1:8765/review.html
