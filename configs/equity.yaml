# AlphaForge — US equities sleeve profile (S5). Deep-merges over configs/base.yaml.
# Resolve with:  af --profile equity <command>
#
# Setting data.asset_class=equity makes alphaforge.config.sleeve.sleeve_for() resolve the
# D1 + XNYS (252-session) sleeve EVERYWHERE the spine asks for its anchor TF / calendar:
# the feature engine grid, forward_returns/label session hops, the universe rank_tf, the
# covariance annualizer, and the walk-forward purge/embargo. Only the keys that differ
# from base are listed; everything else is inherited.

data:
  asset_class: equity
  timeframe: "1d"
  # Equity bars come from the Polygon S3 flat files (survivorship-free day-aggs), NOT a
  # ccxt venue. This field is unused on the equity research path (ingest-equities, universe
  # rebuild, research ic/walkforward all read the lake); it only labels the crypto-only
  # ccxt ingest/clock/live paths, so the value is a placeholder for the equity profile.
  exchange: polygon
  # Survivorship-free history floor; matches the detached flat-files ingest window.
  backfill_start: "2015-01-01T00:00:00Z"

universe:
  # Equities trade for BREADTH (the sqrt(N) decorrelation edge), so the liquid cross
  # section is far wider than the 20-name crypto book: top-200 by 30-session median dollar
  # volume, with entry/exit hysteresis. This is a credible cross-section for the first
  # Rank-IC read while staying tractable for the (not-yet-columnar) backtester; widen
  # toward ~500-1000 once the scale arc (P6/P7) lands — the scale-guard tripwire gates it.
  size: 200
  entry_rank: 160     # hysteresis: enter at top-160 (top-200 is the best honest config;
  exit_rank: 260      # wider top-500 DILUTED momentum net Sharpe 0.24 -> 0.07, 2026-06-19)

portfolio:
  # Breadth: hold the top-50 / bottom-50 by signal (not the v1 default 10/10). On a 200-name
  # universe, 10/10 throws away ~95% of the cross-section; 50/50 harvests the breadth the
  # universe exists for (fundamental law of active management: IR ≈ IC·√breadth). The single
  # highest-impact, non-data-mining Sharpe lever (deep-audit DESK 3).
  rank_top_k: 30
  dollar_neutral: true

signals:
  # THE holding-period horizon h (sessions), shared by: the non-overlapping Rank-IC grid
  # + EWMA-IC blend weighting, the walk-forward PURGE (purge_bars = h), and the mu_ann
  # annualization. 21 sessions == a trading month == the rebalance cadence; it is also
  # where equity momentum's Rank-IC is strongest (h=5/21 t~1.5-1.9 vs h=63 t~0.6). The
  # crypto default is 72 (1h bars); equities hold a month, not three hours.
  horizon_bars: 21

costs:
  # US-equity frictions (only consulted because asset_class=equity). Deliberately
  # conservative so the net-of-cost walk-forward (S12) is honest rather than flattering:
  equity_commission_bps: 1.0        # ~1 bp/side all-in (exchange/SEC/TAF + per-share)
  equity_half_spread_bps: 3.0       # liquid top-200 half-spread (mega-caps ~1bp; conservative)
  equity_borrow_bps_annual: 50.0    # 0.5%/yr general-collateral short borrow, charged per day
  impact_coef: 1.0                  # sqrt-impact Y on D1 ADV (shared with crypto)
  latency_addon_bps: 2.0            # decision->fill arrival drift placeholder
