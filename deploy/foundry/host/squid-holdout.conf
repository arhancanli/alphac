http_port 127.0.0.1:3128
cache_effective_user foundryholdoutegress
cache_effective_group foundryholdoutegress

acl CONNECT method CONNECT
acl TLS_port port 443
acl holdout_objects dstdomain nyc3.digitaloceanspaces.com

http_access deny !TLS_port
http_access allow CONNECT holdout_objects
http_access deny all

cache deny all
cache_mem 0 MB
maximum_object_size 0 KB
via off
forwarded_for delete
request_header_access Authorization allow all
request_header_access All deny all
