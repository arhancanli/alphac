<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="ALPHAC. Evidence before alpha. Point-in-time research, trial accounting, and execution replay. No claimed return.">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C8553D" stop-opacity="0.10"/>
      <stop offset="0.44" stop-color="#C8553D" stop-opacity="0"/>
      <stop offset="1" stop-color="#6F7F78" stop-opacity="0.07"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#090B0D"/>
  <rect width="1280" height="640" fill="url(#wash)"/>
  <circle cx="1080" cy="94" r="130" fill="#C8553D" opacity="0.035" filter="url(#soft)"/>

  <g stroke="#F1EEE7" stroke-opacity="0.055" stroke-width="1">
    <line x1="0" y1="112" x2="1280" y2="112"/>
    <line x1="0" y1="512" x2="1280" y2="512"/>
    <line x1="824" y1="0" x2="824" y2="640"/>
  </g>

  <!-- Four research paths converge into one governed artifact. -->
  <g transform="translate(76 72)" fill="none" stroke="#F1EEE7" stroke-width="1.8">
    <path d="M0 2h12l16 16h22"/>
    <path d="M0 11h14l14 7"/>
    <path d="M0 25h14l14-7"/>
    <path d="M0 34h12l16-16"/>
  </g>
  <circle cx="104" cy="90" r="3.2" fill="#C8553D"/>
  <text x="138" y="99" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="27" font-weight="600" letter-spacing="5" fill="#F1EEE7">ALPHAC</text>
  <text x="1206" y="91" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="15" letter-spacing="2.4" fill="#777C82">CANLI CAPITAL / RESEARCH ENGINE</text>

  <text x="76" y="246" font-family="Georgia, 'Times New Roman', serif" font-size="70" letter-spacing="-1.8" fill="#F1EEE7">Evidence before alpha.</text>
  <text x="80" y="304" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#BDB9B1">A multi-asset engine built to expose</text>
  <text x="80" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#BDB9B1">what the evidence cannot prove.</text>

  <g font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="17" letter-spacing="1.35">
    <text x="80" y="402" fill="#8B8F95">POINT-IN-TIME DATA</text>
    <circle cx="279" cy="396" r="3" fill="#C8553D"/>
    <text x="302" y="402" fill="#8B8F95">PURGED VALIDATION</text>
    <circle cx="510" cy="396" r="3" fill="#C8553D"/>
    <text x="533" y="402" fill="#8B8F95">EXECUTION REPLAY</text>
  </g>
  <text x="80" y="447" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="19" letter-spacing="1.25" fill="#C6C2BA">EVERY TRIAL COUNTED. EVERY GAP EXPLICIT.</text>

  <!-- The evidence receipt is the signature element: provenance, knowledge time, audit hash. -->
  <g transform="translate(862 158)">
    <rect width="344" height="290" rx="2" fill="#0D1013" stroke="#F1EEE7" stroke-opacity="0.16"/>
    <rect x="0" y="0" width="4" height="290" fill="#C8553D"/>
    <text x="28" y="38" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="13" letter-spacing="2" fill="#C8553D">EVIDENCE RECEIPT</text>

    <g font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">
      <text x="28" y="82" font-size="12" letter-spacing="1.5" fill="#62676D">SOURCE BYTES</text>
      <text x="28" y="105" font-size="16" fill="#D5D1C9">SHA-256 BOUND</text>
      <line x1="28" y1="126" x2="316" y2="126" stroke="#F1EEE7" stroke-opacity="0.09"/>

      <text x="28" y="157" font-size="12" letter-spacing="1.5" fill="#62676D">KNOWLEDGE TIME</text>
      <text x="28" y="180" font-size="16" fill="#D5D1C9">AVAILABLE_AT ≤ DECISION</text>
      <line x1="28" y1="201" x2="316" y2="201" stroke="#F1EEE7" stroke-opacity="0.09"/>

      <text x="28" y="232" font-size="12" letter-spacing="1.5" fill="#62676D">COVERAGE</text>
      <text x="28" y="255" font-size="16" fill="#D5D1C9">MISSING ≠ OPEN</text>
    </g>
    <circle cx="316" cy="36" r="5" fill="#C8553D"/>
  </g>

  <text x="80" y="566" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="15" letter-spacing="1.6" fill="#6F7379">OPEN METHODS / PAPER RESEARCH / NO GUARANTEED OR CLAIMED RETURN</text>
  <text x="1206" y="566" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="15" letter-spacing="1.5" fill="#6F7379">github.com/arhancanli/alphac</text>
</svg>
