[project]
name = "alphaforge"
version = "0.1.0"
description = "Institutional-grade mid-frequency quantitative trading system"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "typer>=0.12",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "ccxt>=4.3",
    "tenacity>=8.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
af = "alphaforge.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "freezegun>=1.5",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphaforge"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "DTZ"]
ignore = ["SIM108"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["alphaforge"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["ccxt.*", "duckdb.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not network'"
markers = [
    "network: tests that hit live exchange APIs (deselected in CI)",
    "slow: long-running tests",
]
