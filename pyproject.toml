[project]
name = "alphaforge"
version = "0.1.0"
description = "Institutional-grade mid-frequency quantitative trading system"
authors = [
    { name = "Arhan Canli" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.14.2",
    "structlog>=24.1",
    "typer>=0.12",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "ccxt>=4.3",
    "tenacity>=8.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "matplotlib>=3.11.0",
    "cvxpy-base>=1.9.1",
    "clarabel>=0.11.1",
    "osqp>=1.1.2",
    "exchange-calendars>=4.5",
    "boto3>=1.43.31",
    "opentimestamps-client>=0.7.2",
    "databento>=0.80.0",
    "pypdf>=6.16.1",
    "xlrd>=2.0.2",
    "openpyxl>=3.1.5",
]

[project.urls]
Homepage = "https://canlicapital.com"
Repository = "https://github.com/arhancanli/alphac"

[project.scripts]
af = "alphaforge.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "freezegun>=1.5",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0",
    "boto3-stubs[s3]>=1.43.31",
    # Direct (was transitive via scikit-learn): used by the reference-hash
    # regression to assert BLAS/OpenMP pools are pinned to a single thread.
    "threadpoolctl>=3.5",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphaforge"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "DTZ"]
ignore = ["SIM108"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["alphaforge"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "ccxt.*",
    "duckdb.*",
    "scipy.*",
    "sklearn.*",
    "joblib.*",
    "exchange_calendars.*",
    "boto3.*",
    "botocore.*",
    "threadpoolctl.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Branch coverage of the package is collected on every run. No --cov-fail-under
# floor is set yet: an aspirational threshold would red CI without measuring
# the true baseline first. Once a baseline is observed, pin a floor at or just
# below it here, e.g.  # --cov-fail-under=85
# Correctness tests run in parallel; wall-clock performance guards do not. A
# benchmark measured while 17 sibling workers contend for the same machine is a
# scheduler benchmark, not an engine benchmark. CI runs the mandatory ``slow``
# lane separately with ``-n0`` and preserves its original wall/memory budgets.
addopts = "-q --strict-markers -m 'not network and not slow' --cov=alphaforge --cov-branch -n auto --dist loadfile"
markers = [
    "network: tests that hit live exchange APIs (deselected in CI)",
    "workspace_evidence: offline integration checks that require git-ignored evidence or sibling site workspaces",
    "no_cover: wall-clock benchmarks excluded from coverage instrumentation",
    "slow: long-running tests",
]
